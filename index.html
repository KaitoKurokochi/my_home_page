<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Page</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Thin search bar -->
  <div class="top-bar">
    <form class="search-form" action="https://www.google.com/search" autocomplete="off">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input class="search-input" type="text" name="q" placeholder="Search Google or type a URL" />
      <ul class="search-suggestions"></ul>
    </form>
    <div class="weather-widget" id="weather-widget">
      <button class="weather-summary" id="weather-summary">WF: <span id="weather-text">--</span></button>
      <div class="weather-panel hidden" id="weather-panel"></div>
    </div>
  </div>

  <!-- Tab groups -->
  <section class="groups-section">
    <div class="group-pills" id="group-pills"></div>
    <div class="shortcuts-panel" id="shortcuts-panel"></div>
  </section>

  <!-- Shortcut modal -->
  <div class="modal hidden" id="shortcut-modal">
    <div class="modal-box">
      <h3>Add shortcut</h3>
      <input type="text" id="shortcut-name" placeholder="Name" />
      <input type="url" id="shortcut-url" placeholder="URL (https://...)" />
      <div class="modal-actions">
        <button class="btn-cancel" id="shortcut-cancel">Cancel</button>
        <button class="btn-save" id="shortcut-save">Add</button>
      </div>
    </div>
  </div>

  <!-- Group modal -->
  <div class="modal hidden" id="group-modal">
    <div class="modal-box">
      <h3>New group</h3>
      <input type="text" id="group-name" placeholder="Group name" />
      <div class="modal-actions">
        <button class="btn-cancel" id="group-cancel">Cancel</button>
        <button class="btn-save" id="group-save">Create</button>
      </div>
    </div>
  </div>

  <!-- Tab section -->
  <nav class="tab-nav">
    <button class="tab-btn active" data-tab="news">News</button>
    <button class="tab-btn" data-tab="sports">Sports</button>
  </nav>

  <main>
    <section id="news" class="tab-content active">
      <div id="news-nikkei" class="news-list"></div>
      <p class="news-meta" id="news-meta"></p>
    </section>
    <section id="sports" class="tab-content">
      <h2>Sports</h2>
      <p>Sports videos go here.</p>
    </section>
  </main>

  <script src="news.js"></script>
  <script src="app.js"></script>
</body>
</html>
