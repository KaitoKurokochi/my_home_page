<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weekly Report</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif;
      background: #f8f9fa;
      color: #202124;
      min-height: 100vh;
      padding: 40px 16px;
    }

    .page-wrap {
      max-width: 800px;
      margin: 0 auto;
    }

    /* ── Loading / Error ─────────────────────────────────────────────────────── */

    .state-msg {
      text-align: center;
      color: #9aa0a6;
      font-size: 1rem;
      margin-top: 80px;
    }

    .state-msg.error {
      color: #c5221f;
    }

    /* ── Report body ─────────────────────────────────────────────────────────── */

    .wr-body {
      background: #fff;
      border: 1px solid #e8eaed;
      border-radius: 12px;
      padding: 36px 40px;
      box-shadow: 0 1px 4px rgba(32, 33, 36, 0.08);
    }

    /* Title: # Weekly Report YYYY-MM-DD〜YYYY-MM-DD */
    .wr-title {
      font-size: 1.45rem;
      font-weight: 700;
      color: #202124;
      margin-bottom: 6px;
      letter-spacing: -0.02em;
    }

    /* Meta line: *生成日時: ...* */
    .wr-meta {
      font-size: 0.8rem;
      color: #9aa0a6;
      margin-bottom: 28px;
    }

    /* Section heading: ## LabelName */
    .wr-section {
      font-size: 0.85rem;
      font-weight: 700;
      color: #1a73e8;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin: 28px 0 10px;
      padding: 5px 0 5px 12px;
      border-left: 3px solid #1a73e8;
      background: #f1f5ff;
      border-radius: 0 5px 5px 0;
    }

    .wr-section:first-of-type {
      margin-top: 0;
    }

    /* Key-value row: **key**: value */
    .wr-item {
      display: grid;
      grid-template-columns: 9em 1fr;
      gap: 8px;
      font-size: 0.9rem;
      line-height: 1.6;
      padding: 5px 0;
      border-bottom: 1px solid #f1f3f4;
      color: #202124;
    }

    .wr-item:last-of-type {
      border-bottom: none;
    }

    .wr-key {
      font-weight: 600;
      color: #3c4043;
      flex-shrink: 0;
    }

    .wr-value {
      color: #5f6368;
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* Fallback paragraph */
    .wr-text {
      font-size: 0.88rem;
      color: #5f6368;
      margin: 4px 0;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="page-wrap">
    <div id="content"></div>
  </div>

  <script>
    const NOTES_OWNER = 'KaitoKurokochi';
    const NOTES_REPO  = 'my_notes';

    function notesToken() {
      return localStorage.getItem('NOTE_TOKEN') || '';
    }

    async function fetchWeeklyReportMd() {
      const token = notesToken();
      const headers = { 'Accept': 'application/vnd.github+json' };
      if (token) headers['Authorization'] = `Bearer ${token}`;
      const res = await fetch(
        `https://api.github.com/repos/${NOTES_OWNER}/${NOTES_REPO}/contents/weekly_report.md`,
        { headers }
      );
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const meta = await res.json();
      return decodeURIComponent(escape(atob(meta.content.replace(/\n/g, ''))));
    }

    function esc(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    function weeklyMdToHtml(md) {
      const lines = md.split('\n');
      let html = '';

      for (const line of lines) {
        if (line.startsWith('# ')) {
          html += `<h1 class="wr-title">${esc(line.slice(2).trim())}</h1>`;
        } else if (line.startsWith('## ')) {
          html += `<h2 class="wr-section">${esc(line.slice(3).trim())}</h2>`;
        } else if (line.startsWith('*') && line.endsWith('*') && !line.startsWith('**')) {
          // italic meta line: *生成日時: ...*
          html += `<p class="wr-meta">${esc(line.replace(/^\*|\*$/g, '').trim())}</p>`;
        } else if (line.startsWith('**') && line.includes('**: ')) {
          // bold key: value line
          const colonIdx = line.indexOf('**: ');
          const key   = line.slice(2, colonIdx);
          const value = line.slice(colonIdx + 4).trim();
          html += `<div class="wr-item"><span class="wr-key">${esc(key)}</span><span class="wr-value">${esc(value)}</span></div>`;
        } else if (line.trim() === '') {
          // skip blank lines
        } else {
          html += `<p class="wr-text">${esc(line)}</p>`;
        }
      }
      return html;
    }

    async function main() {
      const el = document.getElementById('content');
      el.innerHTML = '<p class="state-msg">読み込み中...</p>';

      try {
        const md = await fetchWeeklyReportMd();
        el.innerHTML = `<div class="wr-body">${weeklyMdToHtml(md)}</div>`;
      } catch (e) {
        el.innerHTML = `<p class="state-msg error">weekly_report.md の取得に失敗しました: ${e.message}</p>`;
      }
    }

    main();
  </script>
</body>
</html>
