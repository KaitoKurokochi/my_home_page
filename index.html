<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Page</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>My Page</h1>
    <form class="search-form" action="https://www.google.com/search" target="_blank" autocomplete="off">
      <div class="search-wrapper">
        <input class="search-input" type="text" name="q" placeholder="Search..." />
        <ul class="search-suggestions"></ul>
      </div>
      <button class="search-btn" type="submit">&#9654;</button>
    </form>
  </header>

  <section class="shortcuts">
    <div class="shortcuts-grid" id="shortcuts-grid"></div>
    <button class="shortcut-add-btn" id="shortcut-add-btn" title="Add shortcut">+</button>
  </section>

  <div class="shortcut-modal hidden" id="shortcut-modal">
    <div class="shortcut-modal-box">
      <h3>Add shortcut</h3>
      <input type="text" id="shortcut-name" placeholder="Name" />
      <input type="url" id="shortcut-url" placeholder="URL (https://...)" />
      <div class="shortcut-modal-actions">
        <button id="shortcut-cancel">Cancel</button>
        <button id="shortcut-save">Add</button>
      </div>
    </div>
  </div>

  <nav class="tab-nav">
    <button class="tab-btn active" data-tab="tasks">Tasks</button>
    <button class="tab-btn" data-tab="news">News</button>
    <button class="tab-btn" data-tab="sports">Sports</button>
  </nav>

  <main>
    <section id="tasks" class="tab-content active">
      <h2>Tasks</h2>
      <p>Task list goes here.</p>
    </section>

    <section id="news" class="tab-content">
      <h2>News</h2>
      <p>News content goes here.</p>
    </section>

    <section id="sports" class="tab-content">
      <h2>Sports</h2>
      <p>Sports videos go here.</p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
