<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Page</title>
  <link rel="stylesheet" href="css/style.css?v=20260823" />
</head>
<body>

  <main class="main-layout">
    <!-- Left: report + news + sports -->
    <div class="left-col">
      <!-- Meeting Note + Weekly Report buttons (horizontal row) -->
      <div class="report-btns-row" id="report-btns-row" style="display:none">
        <div id="meeting-note-wrap" style="display:none">
          <button id="meeting-note-btn" class="wr-toggle-btn mn-toggle-btn">Research meeting noteを開く →</button>
        </div>
        <div id="weekly-report-wrap" style="display:none">
          <button id="weekly-report-btn" class="wr-toggle-btn">weekly reportを読む →</button>
        </div>
        <div id="improvement-report-wrap" style="display:none">
          <button id="improvement-report-btn" class="wr-toggle-btn">improvement reportを読む →</button>
        </div>
      </div>
      <section id="due-today" class="due-today-section" style="display:none"></section>
      <section id="status-report" class="status-report-section"></section>
      <section id="news">
        <div class="news-header">
          <a href="https://www.nikkei.com/" target="_blank" rel="noopener">
            <img src="images/nikkei_logo.jpg" alt="日経" class="nikkei-logo">
          </a>
          <a id="nikkei-paper-link" class="paper-link" href="#">
            日経新聞 朝刊を読む →
          </a>
        </div>
        <div id="news-graph" class="news-graph"></div>
        <p class="news-meta" id="news-meta"></p>
      </section>
      <!-- NPB -->
      <section class="sports-subsection" id="sports-npb">
        <div class="sports-section-header">
          <a href="https://npb.jp/" target="_blank" rel="noopener">
            <img src="images/npb_logo.svg" alt="NPB" class="npb-logo">
          </a>
        </div>
        <div id="sports-npb-content"><p class="sports-loading">Loading...</p></div>
      </section>
      <!-- MLB -->
      <section class="sports-subsection sports-placeholder" id="sports-mlb">
        <h3 class="sports-sub-title">MLB</h3>
        <p class="sports-coming-soon">Coming soon</p>
      </section>
      <!-- 海外サッカー -->
      <section class="sports-subsection sports-placeholder" id="sports-soccer">
        <h3 class="sports-sub-title">海外サッカー</h3>
        <p class="sports-coming-soon">Coming soon</p>
      </section>
      <!-- その他 -->
      <section class="sports-subsection sports-placeholder" id="sports-other">
        <h3 class="sports-sub-title">その他</h3>
        <p class="sports-coming-soon">Coming soon</p>
      </section>
    </div>

    <!-- Right: widgets + note -->
    <div class="right-col">
      <div class="right-col-header">
        <div id="cal-widget" class="cal-widget">
          <div class="cal-loading">...</div>
        </div>
