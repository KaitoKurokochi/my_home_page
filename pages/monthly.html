<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Monthly Report</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body class="page-body">
  <div class="page-wrap">
    <div id="content"></div>
  </div>

  <script src="../js/config.js"></script>
  <script>
    async function fetchMonthlyReportMd() {
      const text = await githubFetch('my_home_page/reports/monthly_report.md');
      return text;
    }

    function monthlyMdToHtml(md) {
      const lines = md.split('\n');
      let html = '';

      for (const line of lines) {
        if (line.startsWith('# ')) {
          html += `<h1 class="wr-title">${esc(line.slice(2).trim())}</h1>`;
        } else if (line.startsWith('## ')) {
          html += `<h2 class="wr-section">${esc(line.slice(3).trim())}</h2>`;
        } else if (line.startsWith('*') && line.endsWith('*') && !line.startsWith('**')) {
          // italic meta line: *生成日時: ...*
          html += `<p class="wr-meta">${esc(line.replace(/^\*|\*$/g, '').trim())}</p>`;
        } else if (line.startsWith('**') && line.includes('**: ')) {
          // bold key: value line
          const colonIdx = line.indexOf('**: ');
          const key   = line.slice(2, colonIdx);
          const value = line.slice(colonIdx + 4).trim();
          html += `<div class="wr-item"><span class="wr-key">${esc(key)}</span><span class="wr-value">${esc(value)}</span></div>`;
        } else if (line.trim() === '') {
          // skip blank lines
        } else {
          html += `<p class="wr-text">${esc(line)}</p>`;
        }
      }
      return html;
    }

    async function main() {
      const el = document.getElementById('content');
      el.innerHTML = '<p class="state-msg">読み込み中...</p>';

      try {
        const md = await fetchMonthlyReportMd();
        el.innerHTML = `<div class="wr-body">${monthlyMdToHtml(md)}</div>`;
      } catch (e) {
        el.innerHTML = `<p class="state-msg error">monthly_report.md の取得に失敗しました: ${e.message}</p>`;
      }
    }

    main();
  </script>
</body>
</html>
