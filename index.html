<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Page</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>My Page</h1>
  </header>

  <nav class="tab-nav">
    <button class="tab-btn active" data-tab="tasks">Tasks</button>
    <button class="tab-btn" data-tab="news">News</button>
    <button class="tab-btn" data-tab="sports">Sports</button>
  </nav>

  <main>
    <section id="tasks" class="tab-content active">
      <h2>Tasks</h2>
      <p>Task list goes here.</p>
    </section>

    <section id="news" class="tab-content">
      <h2>News</h2>
      <p>News content goes here.</p>
    </section>

    <section id="sports" class="tab-content">
      <h2>Sports</h2>
      <p>Sports videos go here.</p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
