<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Page</title>
  <link rel="stylesheet" href="style.css?v=20260530a" />
</head>
<body>

  <!-- Top bar: search left, calendar right -->
  <div class="top-bar">
    <div class="top-bar-inner">
    <div class="top-bar-left">
      <div class="search-forms">
        <form class="search-form" action="https://www.google.com/search" autocomplete="off">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          <input class="search-input" type="text" name="q" placeholder="Search Google or type a URL" />
          <ul class="search-suggestions"></ul>
        </form>
        <form class="claude-form" id="claude-form" autocomplete="off">
          <img class="claude-icon" src="https://www.google.com/s2/favicons?domain=claude.ai&sz=64" alt="Claude" />
          <input class="claude-input" type="text" id="claude-input" placeholder="Ask Claude..." />
        </form>
      </div>
      <!-- Mini calendar -->
      <div id="cal-widget" class="cal-widget">
        <div class="cal-loading">...</div>
      </div>
    </div>

    <div class="top-bar-right">
      <!-- Apps + weather -->
      <div class="top-bar-actions">

          </a>
        </div>
        <div class="weather-widget" id="weather-widget">
          <button class="weather-summary" id="weather-summary">WF: <span id="weather-text">--</span></button>
          <div class="weather-panel hidden" id="weather-panel"></div>
        </div>
      </div>
    </div>
    </div>
  </div>

  <!-- Tab groups -->
  <section class="groups-section">
    <div class="group-pills" id="group-pills"></div>
    <div class="shortcuts-panel" id="shortcuts-panel"></div>
  </section>

  <!-- Shortcut modal -->
  <div class="modal hidden" id="shortcut-modal">
    <div class="modal-box">
      <h3>Add shortcut</h3>
      <input type="text" id="shortcut-name" placeholder="Name" />
      <input type="url" id="shortcut-url" placeholder="URL (https://...)" />
      <div class="modal-actions">
        <button class="btn-cancel" id="shortcut-cancel">Cancel</button>
        <button class="btn-save" id="shortcut-save">Add</button>
      </div>
    </div>
  </div>

  <!-- Group modal -->
  <div class="modal hidden" id="group-modal">
    <div class="modal-box">
      <h3>New group</h3>
      <input type="text" id="group-name" placeholder="Group name" />
      <div class="modal-actions">
        <button class="btn-cancel" id="group-cancel">Cancel</button>
        <button class="btn-save" id="group-save">Create</button>
      </div>
    </div>
  </div>

  <!-- Graph tooltip (shared) -->
  <div id="graph-tooltip" class="graph-tooltip"></div>

  <main class="main-layout">
    <!-- Left: report + news + sports -->
    <div class="left-col">
      <!-- Meeting Note + Weekly Report buttons (horizontal row) -->
      <div class="report-btns-row" id="report-btns-row">
        <div id="meeting-note-wrap" style="display:none">
          <button id="meeting-note-btn" class="wr-toggle-btn mn-toggle-btn">Research meeting noteを開く →</button>
        </div>
        <div id="weekly-report-wrap" style="display:none">
          <button id="weekly-report-btn" class="wr-toggle-btn">weekly reportを読む →</button>
        </div>
      </div>
      <section id="status-report" class="status-report-section"></section>
      <section id="news">
        <a id="nikkei-paper-link" class="paper-link" href="#">
          日経新聞 朝刊を読む →
        </a>
        <div id="news-graph" class="news-graph"></div>
        <p class="news-meta" id="news-meta"></p>
      </section>
      <section id="sports">
        <h2>Sports</h2>
        <p>Sports videos go here.</p>
      </section>
    </div>

    <!-- Right: note -->
    <div class="right-col">
      <section id="note">
        <div id="note-container"></div>
      </section>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
  <script src="news.js?v=20260517"></script>
  <script src="app.js?v=20260513"></script>
  <script src="note.js?v=20260527c"></script>
  <script src="sync.js?v=20260517b"></script>
  <script src="status.js?v=20260527c"></script>
  <script src="weekly.js?v=20260527d"></script>
  <script src="meeting_note.js?v=20260530a"></script>
</body>
</html>
