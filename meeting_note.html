<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meeting Note</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif;
      background: #f8f9fa;
      color: #202124;
      min-height: 100vh;
      padding: 40px 16px;
    }

    .page-wrap {
      max-width: 800px;
      margin: 0 auto;
    }

    /* ── Loading / Error ─────────────────────────────────────────────────────── */

    .state-msg {
      text-align: center;
      color: #9aa0a6;
      font-size: 1rem;
      margin-top: 80px;
    }

    .state-msg.error {
      color: #c5221f;
    }

    /* ── Note body ───────────────────────────────────────────────────────────── */

    .mn-body {
      background: #fff;
      border: 1px solid #e8eaed;
      border-radius: 12px;
      padding: 36px 40px;
      box-shadow: 0 1px 4px rgba(32, 33, 36, 0.08);
    }

    /* # NTT Meeting — YYYY-MM-DD */
    .mn-title {
      font-size: 1.45rem;
      font-weight: 700;
      color: #202124;
      margin-bottom: 20px;
      letter-spacing: -0.02em;
    }

    /* ## Section heading */
    .mn-section {
      font-size: 0.85rem;
      font-weight: 700;
      color: #1a73e8;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin: 28px 0 10px;
      padding: 5px 0 5px 12px;
      border-left: 3px solid #1a73e8;
      background: #f1f5ff;
      border-radius: 0 5px 5px 0;
    }

    .mn-section:first-of-type {
      margin-top: 0;
    }

    /* Bullet list items */
    .mn-list {
      list-style: none;
      padding: 0;
      margin: 0 0 8px 0;
    }

    .mn-list li {
      font-size: 0.9rem;
      line-height: 1.7;
      padding: 3px 0;
      color: #202124;
      border-bottom: 1px solid #f1f3f4;
    }

    .mn-list li:last-child {
      border-bottom: none;
    }

    /* Checkbox items */
    .mn-list li.mn-todo {
      display: flex;
      align-items: baseline;
      gap: 6px;
    }

    .mn-list li.mn-todo input[type="checkbox"] {
      flex-shrink: 0;
      margin-top: 3px;
    }

    /* ── Rendered markdown ───────────────────────────────────────────────────── */

    .mn-body h1 {
      font-size: 1.45rem;
      font-weight: 700;
      color: #202124;
      margin-bottom: 20px;
      letter-spacing: -0.02em;
    }

    .mn-body h2 {
      font-size: 0.85rem;
      font-weight: 700;
      color: #1a73e8;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin: 28px 0 10px;
      padding: 5px 0 5px 12px;
      border-left: 3px solid #1a73e8;
      background: #f1f5ff;
      border-radius: 0 5px 5px 0;
    }

    .mn-body h3 {
      font-size: 0.9rem;
      font-weight: 700;
      color: #3c4043;
      margin: 18px 0 6px;
      padding-left: 8px;
      border-left: 2px solid #dadce0;
    }

    .mn-body p {
      font-size: 0.9rem;
      line-height: 1.7;
      color: #202124;
      margin: 6px 0;
    }

    .mn-body ul, .mn-body ol {
      padding-left: 20px;
      margin: 6px 0 10px;
    }

    .mn-body li {
      font-size: 0.9rem;
      line-height: 1.7;
      color: #202124;
    }

    .mn-body strong { font-weight: 700; }
    .mn-body em { font-style: italic; color: #5f6368; }

    .mn-body table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
      margin: 12px 0;
    }

    .mn-body th, .mn-body td {
      border: 1px solid #e8eaed;
      padding: 6px 10px;
      text-align: left;
    }

    .mn-body th { background: #f1f3f4; font-weight: 700; }

    .mn-body input[type="checkbox"] { margin-right: 6px; }

    .mn-body hr {
      border: none;
      border-top: 1px solid #e8eaed;
      margin: 20px 0;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/marked@9/marked.min.js"></script>
</head>
<body>
  <div class="page-wrap">
    <div id="content"></div>
  </div>

  <script>
    const NOTES_OWNER = 'KaitoKurokochi';
    const NOTES_REPO  = 'my_notes';

    function notesToken() {
      return localStorage.getItem('NOTE_TOKEN') || '';
    }

    // Extract ?date=YYYY-MM-DD from URL
    function getDateParam() {
      const params = new URLSearchParams(window.location.search);
      return params.get('date') || '';
    }

    async function fetchMeetingNoteMd(dateCompact) {
      const token = notesToken();
      const headers = { 'Accept': 'application/vnd.github+json' };
      if (token) headers['Authorization'] = `Bearer ${token}`;
      const path = `research/meetings/${dateCompact}.md`;
      const res = await fetch(
        `https://api.github.com/repos/${NOTES_OWNER}/${NOTES_REPO}/contents/${path}`,
        { headers }
      );
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const meta = await res.json();
      return decodeURIComponent(escape(atob(meta.content.replace(/\n/g, ''))));
    }

    marked.setOptions({ gfm: true, breaks: false });

    async function main() {
      const el = document.getElementById('content');
      el.innerHTML = '<p class="state-msg">読み込み中...</p>';

      const dateCompact = getDateParam();
      if (!dateCompact) {
        el.innerHTML = '<p class="state-msg error">date パラメータが指定されていません。</p>';
        return;
      }

      // Update page title
      document.title = `Research Meeting Note — ${dateCompact}`;

      try {
        const md = await fetchMeetingNoteMd(dateCompact);
        el.innerHTML = `<div class="mn-body">${marked.parse(md)}</div>`;
      } catch (e) {
        el.innerHTML = `<p class="state-msg error">meeting note の取得に失敗しました: ${e.message}</p>`;
      }
    }

    main();
  </script>
</body>
</html>
